# ==============================================================================
#  config/match.yaml — fonte única da configuração da partida.
#
#  Daqui saem, sem digitar nada duas vezes:
#    • o config_local.yaml de cada container de robô (game.team_id / player_id)
#    • o ROS_DOMAIN_ID de cada container
#    • o mapeamento container → corpo na cena do MuJoCo
#
#  ATENÇÃO: `team_id` precisa ser idêntico ao número cadastrado no GameController
#  oficial.  Se divergir, brain.cpp:1407 descarta o pacote inteiro e o robô fica
#  em INITIAL para sempre, sem erro visível.  Ver docs/gamecontroller-integracao.md.
# ==============================================================================

teams:
  home: 56    # ataca +x (gol adversário em x = +7)
  away: 57    # ataca -x

# `slot` é o índice do robô na ordem dos <include> de scenes/soccer_scene.xml
# (1, 3, 5, 2, 4, 6) — é o que indexa qpos/qvel/ctrl.  Não mude sem mudar a cena.
#
# `domain_id` == número do robô, de propósito: `docker compose up robot3` e
# `run_ros2 --brains 3` falam do mesmo robô, no domínio DDS 3.
robots:
  - name: robot1
    slot: 0
    team: home
    player_id: 1
    role: goal_keeper
    domain_id: 1

  - name: robot3
    slot: 1
    team: home
    player_id: 2
    role: striker
    domain_id: 3

  - name: robot5
    slot: 2
    team: home
    player_id: 3
    role: striker
    domain_id: 5

  - name: robot2
    slot: 3
    team: away
    player_id: 1
    role: goal_keeper
    domain_id: 2

  - name: robot4
    slot: 4
    team: away
    player_id: 2
    role: striker
    domain_id: 4

  - name: robot6
    slot: 5
    team: away
    player_id: 3
    role: striker
    domain_id: 6
